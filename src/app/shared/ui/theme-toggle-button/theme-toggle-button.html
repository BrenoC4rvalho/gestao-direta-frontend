<button
  type="button"
  class="flex min-h-10 w-full cursor-pointer items-center justify-center gap-2 rounded-control border border-border bg-surface px-3 text-sm font-semibold text-text-primary transition-colors hover:bg-background focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
  aria-label="Alternar tema"
  title="Alternar tema"
  (click)="toggleTheme()"
>
  <svg [lucideIcon]="themeStore.isDark() ? 'sun' : 'moon'" class="size-4" aria-hidden="true"></svg>
  <span>{{ themeStore.isDark() ? 'Modo claro' : 'Modo escuro' }}</span>
</button>
