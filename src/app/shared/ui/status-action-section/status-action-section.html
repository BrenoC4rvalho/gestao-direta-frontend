<section
  class="rounded-app border border-border bg-surface p-4 text-text-primary sm:flex sm:items-center sm:justify-between sm:gap-5"
>
  <div class="space-y-2">
    <div class="flex flex-wrap items-center gap-2">
      <h3 class="text-sm font-semibold text-text-primary">{{ title() }}</h3>

      @if (badgeLabel()) {
        <gd-badge [variant]="badgeVariant()" size="sm">{{ badgeLabel() }}</gd-badge>
      }
    </div>

    <p class="text-sm leading-6 text-text-muted">{{ description() }}</p>
  </div>

  @if (shouldShowAction()) {
    <div class="mt-4 sm:mt-0 sm:shrink-0">
      <gd-button
        type="button"
        class="block w-full sm:w-auto"
        [variant]="buttonVariant()"
        [disabled]="actionDisabled()"
        [loading]="actionLoading()"
        [fullWidth]="true"
        (click)="emitAction()"
      >
        {{ actionLabel() }}
      </gd-button>
    </div>
  }
</section>
