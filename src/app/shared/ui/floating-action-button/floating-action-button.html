<div class="group relative">
  <button
    type="button"
    class="inline-flex size-14 cursor-pointer items-center justify-center rounded-full bg-primary text-white shadow-soft transition-all duration-200 ease-out hover:-translate-y-0.5 hover:bg-primary-hover hover:shadow-md focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0 disabled:hover:bg-primary disabled:active:scale-100"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="tooltipId"
    (click)="emitClick()"
  >
    <svg [lucideIcon]="icon()" class="size-6" aria-hidden="true"></svg>
  </button>

  <div
    [id]="tooltipId"
    role="tooltip"
    class="pointer-events-none absolute bottom-full right-0 z-40 mb-3 w-72 max-w-[calc(100vw-2rem)] invisible translate-y-1 rounded-app border border-border bg-surface p-3 text-left shadow-soft opacity-0 transition-all duration-150 group-hover:visible group-hover:translate-y-0 group-hover:opacity-100 group-focus-within:visible group-focus-within:translate-y-0 group-focus-within:opacity-100"
  >
    <p class="text-sm font-semibold text-text-primary">{{ tooltipTitle() }}</p>
    <p class="mt-1 text-xs leading-5 text-text-muted">{{ tooltipDescription() }}</p>
  </div>
</div>
