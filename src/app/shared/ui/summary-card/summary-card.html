<article [class]="articleClasses()">
  <div [class]="headerClasses()">
    <div class="flex min-w-0 items-center gap-3">
      <div [class]="'flex shrink-0 items-center justify-center rounded-full ' + iconClasses() + ' ' + toneClasses()">
        <svg [lucideIcon]="icon()" [class]="iconSvgClasses()" aria-hidden="true"></svg>
      </div>

      <p [class]="titleClasses()">{{ title() }}</p>
    </div>

    @if (description(); as descriptionText) {
      <div class="group relative z-50 shrink-0">
        <button
          type="button"
          [class]="tooltipButtonClasses()"
          [attr.aria-label]="'Explicação sobre ' + title()"
          [attr.aria-describedby]="tooltipId"
          [attr.aria-expanded]="tooltipOpen()"
          (click)="toggleTooltip()"
          (blur)="closeTooltip()"
          (keydown.escape)="closeTooltip()"
        >
          <svg lucideIcon="info" class="size-4" aria-hidden="true"></svg>
        </button>

        <div [id]="tooltipId" role="tooltip" [class]="tooltipClasses()">
          <p>{{ descriptionText }}</p>
          @if (detail(); as detailText) {
            <p class="mt-1 text-text-muted">{{ detailText }}</p>
          }
        </div>
      </div>
    }
  </div>

  <div [class]="valueContainerClasses()">
    <p [class]="valueClasses()">{{ value() }}</p>
    @if (metricLayout()) {
      <div [class]="metaSlotClasses()">
        @if (meta(); as metaText) {
          <p [class]="metaClasses()">{{ metaText }}</p>
        }
      </div>
    } @else if (meta(); as metaText) {
      <p [class]="metaClasses()">{{ metaText }}</p>
    }
  </div>
</article>
