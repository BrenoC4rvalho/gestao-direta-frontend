<div class="flex flex-col gap-1.5">
  <label [for]="id()" class="text-sm font-medium text-text-primary">
    {{ label() }}
    @if (required()) {
      <span class="text-danger" aria-hidden="true">*</span>
    }
  </label>

  <div class="relative">
    @if (prefix(); as prefixText) {
      <span
        class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-sm font-medium text-text-muted"
        aria-hidden="true"
      >
        {{ prefixText }}
      </span>
    }

    <input
      [id]="id()"
      [type]="inputType()"
      [formControl]="control()"
      [placeholder]="placeholder()"
      [required]="required()"
      [attr.disabled]="disabled() ? '' : null"
      [readOnly]="readonly()"
      [autocomplete]="autocomplete() ?? ''"
      [attr.inputmode]="inputmode()"
      [attr.maxlength]="maxlength()"
      [attr.min]="min()"
      [attr.step]="step()"
      [attr.aria-invalid]="showError()"
      [attr.aria-describedby]="describedBy()"
      [class]="fieldClasses()"
    />
    @if (type() === 'password') {
      <button
        type="button"
        class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-text-muted transition-colors hover:text-text-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-primary"
        [attr.aria-label]="passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="passwordVisible()"
        [title]="passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
        [disabled]="disabled()"
        (click)="togglePassword()"
      >
        <svg [lucideIcon]="passwordVisible() ? 'eye-off' : 'eye'" class="size-4" aria-hidden="true"></svg>
      </button>
    }
  </div>

  @if (showError()) {
    <gd-field-error [id]="errorId()" [message]="errorMessage()" />
  } @else if (hint(); as hintText) {
    <p [id]="hintId()" class="text-sm leading-5 text-text-muted">{{ hintText }}</p>
  }
</div>
