<div class="grid gap-1.5 rounded-control border border-border bg-background/50 p-3" aria-live="polite">
  <p class="text-sm font-medium text-text-primary">Sua senha precisa ter:</p>
  <ul class="grid min-h-[7.5rem] content-start gap-1 text-sm text-text-muted">
    @for (requirement of requirements(); track requirement.key) {
      <li class="flex items-start gap-2" [class.text-success]="requirement.met">
        <svg
          [lucideIcon]="requirement.met ? 'circle-check' : 'circle-off'"
          class="mt-0.5 size-4 shrink-0"
          [attr.aria-label]="requirement.met ? 'Atendido' : 'Pendente'"
          aria-hidden="true"
        ></svg>
        <span>{{ requirement.label }}</span>
        <span class="sr-only">{{ requirement.met ? 'Atendido' : 'Pendente' }}</span>
      </li>
    }
  </ul>
</div>
