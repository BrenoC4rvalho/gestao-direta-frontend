<div class="flex flex-col gap-1.5">
  <label [for]="id()" class="flex w-fit items-center gap-1 text-sm font-medium text-text-primary">
    <span>
      {{ label() }}
      @if (required()) {
        <span class="text-danger" aria-hidden="true">*</span>
      }
    </span>
    @if (labelTooltip(); as tooltipText) {
      <gd-tooltip
        class="cursor-help text-text-muted transition-colors hover:text-primary focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
        [ariaLabel]="labelTooltipAriaLabel() ?? 'Mais informações sobre ' + label()"
        [content]="tooltipText"
      >
        <svg lucideIcon="info" class="size-4" aria-hidden="true"></svg>
      </gd-tooltip>
    }
  </label>

  <select
    [id]="id()"
    [formControl]="control()"
    [required]="required()"
    [attr.disabled]="disabled() ? '' : null"
    [attr.aria-invalid]="showError()"
    [attr.aria-describedby]="describedBy()"
    [class]="fieldClasses()"
  >
    <option value="">{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
      <option [ngValue]="option.value">{{ option.label }}</option>
    }
  </select>

  @if (showError()) {
    <gd-field-error [id]="errorId()" [message]="errorMessage()" />
  } @else if (hint(); as hintText) {
    <p [id]="hintId()" class="text-sm leading-5 text-text-muted">{{ hintText }}</p>
  }
</div>
