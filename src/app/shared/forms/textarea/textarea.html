<div class="flex flex-col gap-1.5">
  <label [for]="id()" class="text-sm font-medium text-text-primary">
    {{ label() }}
    @if (required()) {
      <span class="text-danger" aria-hidden="true">*</span>
    }
  </label>

  <textarea
    [id]="id()"
    [formControl]="control()"
    [placeholder]="placeholder()"
    [required]="required()"
    [attr.disabled]="disabled() ? '' : null"
    [readOnly]="readonly()"
    [rows]="rows()"
    [attr.maxlength]="maxlength()"
    [attr.aria-invalid]="showError()"
    [attr.aria-describedby]="describedBy()"
    [class]="fieldClasses()"
  ></textarea>

  <div class="flex items-start justify-between gap-3">
    <div>
      @if (showError()) {
        <gd-field-error [id]="errorId()" [message]="errorMessage()" />
      } @else if (hint(); as hintText) {
        <p [id]="hintId()" class="text-sm leading-5 text-text-muted">{{ hintText }}</p>
      }
    </div>

    @if (maxlength(); as max) {
      <p [id]="counterId()" class="shrink-0 text-sm leading-5 text-text-muted">
        {{ valueLength() }}/{{ max }}
      </p>
    }
  </div>
</div>
