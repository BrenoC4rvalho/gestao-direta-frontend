@if (rendered()) {
  <div [class]="backdropClasses()" aria-hidden="true" (click)="close()"></div>

  <section
    #panel
    [class]="panelClasses()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    tabindex="-1"
  >
    <header class="flex items-start justify-between gap-4 border-b border-border px-5 py-4">
      <div>
        <h2 [id]="titleId" class="text-lg font-semibold text-text-primary">{{ title() }}</h2>
        @if (description(); as dialogDescription) {
          <p class="mt-1 text-sm leading-6 text-text-muted">{{ dialogDescription }}</p>
        }
      </div>

      <button
        #closeButton
        type="button"
        class="inline-flex size-9 shrink-0 cursor-pointer items-center justify-center rounded-control text-text-muted transition-colors hover:bg-background hover:text-text-primary focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
        aria-label="Fechar modal"
        (click)="close()"
      >
        <svg lucideIcon="x" class="size-5" aria-hidden="true"></svg>
      </button>
    </header>

    <div class="min-h-0 flex-1 overflow-y-auto px-5 py-5">
      <ng-content />
    </div>
  </section>
}
