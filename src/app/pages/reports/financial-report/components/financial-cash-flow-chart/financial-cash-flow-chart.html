<div class="flex h-72 w-full overflow-hidden lg:h-80">
  <div class="relative w-max shrink-0 pb-8 pl-1 pr-3" aria-hidden="true">
    <div class="invisible flex w-max flex-col items-end text-right text-xs">
      @for (tick of scale().ticks; track tick) {
        <span class="whitespace-nowrap">{{ formatAxisCurrency(tick) }}</span>
      }
    </div>
    @for (tick of scale().ticks; track tick) {
      <span class="absolute right-3 -translate-y-1/2 whitespace-nowrap text-right text-xs text-text-muted" [class.font-medium]="tick === 0" [style.top.%]="axisPosition(tick)">{{ formatAxisCurrency(tick) }}</span>
    }
  </div>
  <div class="min-w-0 flex-1 overflow-x-auto overscroll-x-contain">
    <div class="h-full min-w-full" [style.min-width.px]="chartWidth()">
      <canvas baseChart [type]="chartType" [data]="chartData()" [options]="chartOptions()" role="img" aria-label="Gráfico de fluxo de caixa acumulado"></canvas>
    </div>
  </div>
</div>
<div class="mt-4 flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-sm text-text-muted" aria-label="Legenda do fluxo de caixa acumulado">
  <span class="inline-flex items-center gap-2"><span class="h-0.5 w-4 bg-[#2563EB]"></span>Saldo previsto</span>
  <span class="inline-flex items-center gap-2"><span class="w-4 border-t-2 border-dashed border-[#2563EB]/65"></span>Saldo projetado com atrasos</span>
</div>
