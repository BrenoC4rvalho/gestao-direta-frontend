<div class="relative h-64 w-full sm:h-72 lg:h-80">
  <canvas
    baseChart
    [type]="chartType"
    [data]="chartData()"
    [options]="chartOptions()"
    aria-label="Gráfico de fluxo de caixa projetado de janeiro a dezembro"
    role="img"
  ></canvas>
</div>

<ul class="sr-only" aria-label="Valores mensais do fluxo de caixa">
  @for (point of accessiblePoints(); track point.label) {
    <li>{{ point.month }}: {{ point.formattedValue }}</li>
  }
</ul>
