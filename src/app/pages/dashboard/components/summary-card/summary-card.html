<gd-card padding="sm">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-sm font-medium text-text-muted">{{ title() }}</p>
      <p class="mt-2 truncate text-2xl font-semibold text-text-primary">{{ value() }}</p>
      <p class="mt-2 text-xs leading-5 text-text-muted">{{ helper() }}</p>
    </div>

    <div [class]="'flex size-10 shrink-0 items-center justify-center rounded-full ' + toneClasses()">
      <svg [lucideIcon]="icon()" class="size-5" aria-hidden="true"></svg>
    </div>
  </div>
</gd-card>
