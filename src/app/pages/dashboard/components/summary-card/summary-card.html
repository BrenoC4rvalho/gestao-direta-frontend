<gd-card padding="lg">
  <div class="flex items-start gap-4">
    <div [class]="'flex size-12 shrink-0 items-center justify-center rounded-full ' + toneClasses()">
      <svg [lucideIcon]="icon()" class="size-6" aria-hidden="true"></svg>
    </div>

    <div class="min-w-0 flex-1">
      <p class="text-sm font-medium text-text-muted">{{ title() }}</p>
      <p class="mt-2 break-words text-2xl font-semibold leading-tight text-text-primary">{{ value() }}</p>
      <p class="mt-3 text-xs leading-5 text-text-muted">{{ helper() }}</p>
    </div>
  </div>
</gd-card>
