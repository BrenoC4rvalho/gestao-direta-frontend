<article class="relative z-0 flex h-full min-h-[128px] flex-col justify-between gap-5 rounded-app border border-border bg-surface p-6 text-text-primary transition-all duration-200 ease-out sm:hover:-translate-y-0.5 sm:hover:border-primary/25 sm:hover:shadow-md focus-within:z-30 sm:hover:z-30 overflow-visible">
    <div class="flex items-start justify-between gap-3">
      <div class="flex min-w-0 items-start gap-3">
        <div [class]="'flex size-11 shrink-0 items-center justify-center rounded-full ' + toneClasses()">
          <svg [lucideIcon]="icon()" class="size-5" aria-hidden="true"></svg>
        </div>

        <p class="min-w-0 pt-1 text-sm font-medium leading-5 text-text-muted">{{ title() }}</p>
      </div>

      @if (description(); as descriptionText) {
        <div class="group relative z-50 shrink-0">
          <button
            type="button"
            class="flex size-8 cursor-pointer items-center justify-center rounded-full text-text-muted transition-colors hover:bg-highlight-soft hover:text-primary focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
            [attr.aria-label]="'Explicação sobre ' + title()"
            [attr.aria-describedby]="tooltipId"
            [attr.aria-expanded]="tooltipOpen()"
            (click)="toggleTooltip()"
            (blur)="closeTooltip()"
            (keydown.escape)="closeTooltip()"
          >
            <svg lucideIcon="info" class="size-4" aria-hidden="true"></svg>
          </button>

          <div [id]="tooltipId" role="tooltip" [class]="tooltipClasses()">
            <p>{{ descriptionText }}</p>
            @if (detail(); as detailText) {
              <p class="mt-1 text-text-muted">{{ detailText }}</p>
            }
          </div>
        </div>
      }
    </div>

    <p class="break-words text-2xl font-semibold leading-tight text-text-primary">{{ value() }}</p>
</article>
