<div class="relative w-full sm:w-60">
  <button
    #trigger
    type="button"
    class="flex h-16 w-full cursor-pointer items-center gap-3 rounded-app border border-border bg-surface px-3 text-left shadow-sm transition-colors hover:border-primary/35 hover:bg-background focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
    aria-haspopup="listbox"
    [attr.aria-label]="'Período: ' + selectedLabel()"
    [attr.aria-controls]="menuId"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
    (keydown)="handleTriggerKeydown($event)"
  >
    <svg lucideIcon="calendar" class="size-5 shrink-0 text-primary" aria-hidden="true"></svg>

    <span class="min-w-0 flex-1">
      <span class="block text-xs font-medium leading-4 text-text-muted">Período</span>
      <span class="mt-0.5 block truncate text-sm font-semibold leading-5 text-text-primary">
        {{ selectedLabel() }}
      </span>
    </span>

    <svg
      [lucideIcon]="open() ? 'chevron-up' : 'chevron-down'"
      class="size-4 shrink-0 text-text-muted"
      aria-hidden="true"
    ></svg>
  </button>

  @if (open()) {
    <div
      [id]="menuId"
      role="listbox"
      aria-label="Período do resumo financeiro"
      class="absolute right-0 z-50 mt-2 w-full overflow-hidden rounded-app border border-border bg-surface p-1 shadow-soft"
    >
      @for (period of periods(); track period; let index = $index) {
        <button
          #optionButton
          type="button"
          role="option"
          class="flex min-h-10 w-full cursor-pointer items-center rounded-md px-3 py-2 text-left text-sm font-medium transition-colors hover:bg-background focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-[-2px] focus-visible:outline-primary"
          [class.bg-highlight-soft]="selectedPeriod() === period"
          [class.text-primary]="selectedPeriod() === period"
          [class.text-text-primary]="selectedPeriod() !== period"
          [attr.aria-selected]="selectedPeriod() === period"
          (click)="selectPeriod(period)"
          (keydown)="handleOptionKeydown($event, index)"
        >
          {{ periodLabel(period) }}
        </button>
      }
    </div>
  }
</div>
