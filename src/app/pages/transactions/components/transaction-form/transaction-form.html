<form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid gap-4 sm:grid-cols-2">
    <div class="sm:col-span-2">
      <gd-input
        id="transaction-description"
        label="Descrição"
        placeholder="Ex.: Venda de leite, Compra de sementes"
        autocomplete="off"
        [control]="form.controls.description"
        [required]="true"
        [hint]="missingFieldHint('description')"
        [errorMessage]="descriptionErrorMessage()"
      />
    </div>

    <gd-select
      id="transaction-type"
      label="Tipo"
      placeholder="Selecione o tipo"
      [control]="form.controls.type"
      [options]="typeOptions"
      [required]="true"
      [hint]="missingFieldHint('type')"
      [errorMessage]="typeErrorMessage()"
    />

    <gd-input
      id="transaction-amount"
      label="Valor"
      type="text"
      placeholder="0,00"
      inputmode="decimal"
      prefix="R$"
      [control]="form.controls.amount"
      [required]="true"
      [hint]="missingFieldHint('amount')"
      [errorMessage]="amountErrorMessage()"
    />

    <div class="sm:col-span-2">
      <gd-select
        id="transaction-category"
        label="Categoria"
        [placeholder]="categoryPlaceholder()"
        [control]="form.controls.categoryId"
        [options]="categoryOptions()"
        [required]="categoryRequired()"
        [disabled]="categoryDisabled()"
        [hint]="missingFieldHint('category')"
        [errorMessage]="categoryErrorMessage()"
      />
    </div>

    <div class="sm:col-span-2">
      <gd-select
        id="transaction-harvest-season"
        label="Safra"
        placeholder="Sem safra"
        [control]="form.controls.harvestSeasonId"
        [options]="harvestSeasonOptions()"
      />
    </div>

    <gd-input
      id="transaction-date"
      label="Data da movimentação"
      type="date"
      [control]="form.controls.transactionDate"
      [required]="true"
      [hint]="missingFieldHint('transactionDate')"
      [errorMessage]="transactionDateErrorMessage()"
    />

    <gd-input id="transaction-due-date" label="Vencimento" type="date" [control]="form.controls.dueDate" />

    <gd-input id="transaction-paid-at" label="Data de pagamento" type="date" [control]="form.controls.paidAt" />

    <gd-select
      id="transaction-status"
      label="Status de pagamento"
      placeholder="Selecione o status"
      [control]="form.controls.status"
      [options]="statusOptions()"
      [required]="true"
      [errorMessage]="statusErrorMessage()"
    />

    <div class="sm:col-span-2">
      <gd-select
        id="transaction-payment-method"
        label="Método de pagamento"
        placeholder="Selecione o método"
        [control]="form.controls.paymentMethod"
      [options]="paymentMethodOptions"
      [hint]="missingFieldHint('paymentMethod')"
      />
    </div>

    <div class="sm:col-span-2">
      <gd-textarea
        id="transaction-notes"
        label="Observações"
        placeholder="Adicione detalhes relevantes para a movimentação"
        [control]="form.controls.notes"
        [rows]="4"
        [maxlength]="500"
      />
    </div>
  </div>

  @if (showActions()) {
  <div class="grid gap-3 border-t border-border pt-4 sm:grid-cols-2">
    <gd-button
      type="button"
      variant="outline"
      [disabled]="submitting()"
      [fullWidth]="true"
      (click)="cancel()"
    >
      Cancelar
    </gd-button>
    <gd-button type="submit" [loading]="submitting()" [fullWidth]="true">Salvar</gd-button>
  </div>
  }
</form>
