<main
  class="relative flex min-h-dvh items-center justify-center overflow-hidden bg-background px-6"
>
  <img src="/assets/img/recovery.png" alt="" class="absolute inset-0 size-full object-cover" />
  <div class="absolute inset-0 bg-background/75"></div>
  <section
    class="relative z-10 w-full max-w-md rounded-3xl border border-border bg-surface p-8 text-center shadow-soft"
  >
    <img
      src="/assets/brand/logo_horizontal.svg"
      alt="Gestão Direta"
      class="mx-auto mb-6 h-auto w-52"
    />
    <h1 class="text-2xl font-semibold text-text-primary">Senha redefinida</h1>
    <p class="mt-3 text-sm leading-6 text-text-muted">
      Sua senha foi atualizada. Entre novamente para continuar.
    </p>
    <gd-button class="mt-6" [fullWidth]="true" routerLink="/login">Ir para o login</gd-button>
  </section>
</main>
