<main class="mx-auto flex min-h-dvh max-w-md items-center px-6"><section class="w-full rounded-3xl border border-border bg-surface p-8 shadow-soft"><h1 class="text-2xl font-semibold text-text-primary">Recuperar senha</h1><p class="mt-3 text-sm text-text-muted">Informe seu e-mail. Se sua conta tiver um Telegram vinculado, enviaremos um código de recuperação.</p>@if (sent()) { <p class="mt-5 text-sm text-text-primary">Se houver uma conta válida com Telegram vinculado, um código será enviado.</p><gd-button class="mt-5" [fullWidth]="true" (click)="continue()">Informar código</gd-button> } @else { <form class="mt-6 grid gap-4" [formGroup]="form" (ngSubmit)="submit()"><gd-input id="recovery-email" label="E-mail" type="email" [control]="form.controls.email" [required]="true"/><gd-button type="submit" [fullWidth]="true" [loading]="loading()">Enviar código</gd-button></form> }</section></main>
