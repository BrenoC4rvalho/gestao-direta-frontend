<main
  class="relative flex min-h-dvh items-center justify-center overflow-hidden bg-background px-6"
>
  <img src="/assets/img/recovery.png" alt="" class="absolute inset-0 size-full object-cover" />
  <div class="absolute inset-0 bg-background/75"></div>
  <section
    class="relative z-10 w-full max-w-md rounded-3xl border border-border bg-surface p-8 shadow-soft"
  >
    <img
      src="/assets/brand/logo_horizontal.svg"
      alt="Gestão Direta"
      class="mx-auto mb-6 h-auto w-52"
    />
    <h1 class="text-2xl font-semibold text-text-primary">Recuperar senha</h1>
    <p class="mt-3 text-sm leading-6 text-text-muted">
      Informe seu e-mail para receber as orientações de recuperação pelos canais disponíveis.
    </p>

    <form class="mt-6 grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <gd-input
        id="recovery-email"
        label="E-mail"
        type="email"
        [control]="form.controls.email"
        [required]="true"
      />
      @if (requestFailed()) {
        <p class="text-sm text-danger" role="alert">Não foi possível processar a solicitação. Tente novamente.</p>
      }
      <gd-button type="submit" [fullWidth]="true" [loading]="loading()">Continuar</gd-button>
    </form>

    <a routerLink="/login" class="mt-6 block text-center text-sm font-medium text-primary"
      >Voltar para login</a
    >
  </section>
</main>
