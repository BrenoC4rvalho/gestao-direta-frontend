<main class="mx-auto flex min-h-dvh max-w-md items-center px-6">
  <section class="w-full rounded-3xl border border-border bg-surface p-8 shadow-soft">
    <h1 class="text-2xl font-semibold text-text-primary">Crie uma nova senha</h1>
    <p class="mt-3 text-sm leading-6 text-text-muted">Use ao menos 8 caracteres, com letras maiúsculas, minúsculas, número e símbolo.</p>
    <form class="mt-6 grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <gd-input id="new-password" label="Nova senha" type="password" [control]="form.controls.password" [required]="true" />
      <gd-input id="confirm-password" label="Confirmar nova senha" type="password" [control]="form.controls.confirmPassword" [required]="true" />
      @if (errorMessage()) {
        <p class="text-sm text-danger">{{ errorMessage() }}</p>
      }
      <gd-button type="submit" [loading]="loading()" [fullWidth]="true">Redefinir senha</gd-button>
    </form>
  </section>
</main>
