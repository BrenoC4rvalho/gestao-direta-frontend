<main class="mx-auto flex min-h-dvh max-w-md items-center px-6"><section class="w-full rounded-3xl border border-border bg-surface p-8"><h1 class="text-2xl font-semibold">Informe o código</h1><form class="mt-6 grid gap-4" [formGroup]="form">@if (!token()) { <gd-input id="recovery-code" label="Código de seis dígitos" [control]="form.controls.code" inputmode="numeric"/><gd-button type="button" [loading]="loading()" [fullWidth]="true" (click)="verify()">Validar código</gd-button> } @else { <gd-input id="new-password" label="Nova senha" type="password" [control]="form.controls.password"/><gd-input id="confirm-password" label="Confirmar nova senha" type="password" [control]="form.controls.confirm"/><gd-button type="button" [loading]="loading()" [fullWidth]="true" (click)="reset()">Redefinir senha</gd-button> }</form></section></main>
