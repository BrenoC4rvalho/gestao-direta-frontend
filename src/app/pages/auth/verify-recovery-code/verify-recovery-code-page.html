<main
  class="relative flex min-h-dvh items-center justify-center overflow-hidden bg-background px-6"
>
  <img src="/assets/img/recovery.png" alt="" class="absolute inset-0 size-full object-cover" />
  <div class="absolute inset-0 bg-background/75"></div>
  <section
    class="relative z-10 w-full max-w-md rounded-3xl border border-border bg-surface p-8 shadow-soft"
  >
    <img
      src="/assets/brand/logo_horizontal.svg"
      alt="Gestão Direta"
      class="mx-auto mb-6 h-auto w-52"
    />
    <h1 class="text-2xl font-semibold text-text-primary">Informe o código</h1>
    <p class="mt-3 text-sm leading-6 text-text-muted">
      Digite o código de seis dígitos enviado para (**) *****-{{ phoneLastFour() }}.
    </p>
    <form class="mt-6 grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <gd-input
        id="recovery-code"
        label="Código de seis dígitos"
        inputmode="numeric"
        [control]="form.controls.code"
        [required]="true"
      />
      @if (errorMessage()) {
        <p class="text-sm text-danger">{{ errorMessage() }}</p>
      }
      <gd-button type="submit" [fullWidth]="true" [loading]="loading()">Validar código</gd-button>
    </form>
    <div class="mt-4">
      <gd-button variant="secondary" [fullWidth]="true" [loading]="resending()" (click)="resend()"
        >Enviar novo código</gd-button
      >
    </div>
    <a routerLink="/forgot-password" class="mt-6 block text-center text-sm font-medium text-primary"
      >Voltar</a
    >
  </section>
</main>
