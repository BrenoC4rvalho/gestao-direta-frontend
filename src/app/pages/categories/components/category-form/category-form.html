<form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid gap-4">
    <gd-input
      id="category-name"
      label="Nome"
      placeholder="Ex.: Venda de leite, Adubo, Combustível"
      autocomplete="off"
      [control]="form.controls.name"
      [required]="true"
      [errorMessage]="nameErrorMessage()"
    />

    <gd-select
      id="category-type"
      label="Tipo"
      placeholder="Selecione o tipo"
      [control]="form.controls.type"
      [options]="typeOptions()"
      [required]="true"
      [errorMessage]="typeErrorMessage()"
    />
  </div>

  <div class="grid gap-3 border-t border-border pt-4 sm:grid-cols-2">
    <gd-button
      type="button"
      variant="outline"
      [disabled]="submitting()"
      [fullWidth]="true"
      (click)="cancel()"
    >
      Cancelar
    </gd-button>
    <gd-button type="submit" [loading]="submitting()" [fullWidth]="true">Salvar</gd-button>
  </div>
</form>
