<article
  class="grid gap-4 px-4 py-4 transition-all duration-200 ease-out hover:bg-background/60 sm:px-5 sm:hover:border-primary/25 md:grid-cols-[minmax(0,1fr)_8rem_8rem_auto] md:items-center"
  [attr.aria-label]="'Categoria ' + category().name"
>
  <div class="min-w-0">
    <h3 class="truncate text-base font-semibold text-text-primary">{{ category().name }}</h3>
  </div>

  <div class="flex items-center justify-between gap-3 md:block">
    <span class="text-xs font-medium uppercase tracking-wide text-text-muted md:hidden">Tipo</span>
    <div>
      <gd-badge [variant]="typeVariant()" size="sm">{{ typeLabel() }}</gd-badge>
    </div>
  </div>

  <div class="flex items-center justify-between gap-3 md:block">
    <span class="text-xs font-medium uppercase tracking-wide text-text-muted md:hidden">
      Status
    </span>
    <div>
      <gd-badge [variant]="statusVariant()" size="sm">{{ statusLabel() }}</gd-badge>
    </div>
  </div>

  @if (canEdit()) {
    <div class="grid gap-2 border-t border-border pt-4 md:min-w-48 md:border-t-0 md:pt-0">
      <gd-button
        type="button"
        variant="outline"
        size="sm"
        [fullWidth]="true"
        (click)="editCategory()"
      >
        Editar
      </gd-button>
    </div>
  }
</article>
