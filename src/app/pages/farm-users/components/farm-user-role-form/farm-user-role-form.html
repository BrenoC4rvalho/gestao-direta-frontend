<form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <gd-select
      id="farm-user-new-role"
      label="Papel na fazenda"
      placeholder="Selecione o novo papel"
      [control]="form.controls.role"
      [options]="roleOptions()"
      [required]="true"
      [disabled]="submitting()"
      [errorMessage]="roleErrorMessage()"
    />
  </div>

  <div class="grid gap-3 border-t border-border pt-4 sm:grid-cols-2">
    <gd-button
      type="button"
      variant="outline"
      [disabled]="submitting()"
      [fullWidth]="true"
      (click)="cancel()"
    >
      Cancelar
    </gd-button>
    <gd-button type="submit" [loading]="submitting()" [fullWidth]="true">
      Salvar alterações
    </gd-button>
  </div>
</form>
