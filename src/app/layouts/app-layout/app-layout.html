<div class="min-h-dvh bg-background text-text-primary">
  <gd-desktop-sidebar class="hidden lg:block" />

  <div class="lg:pl-72">
    <gd-mobile-header class="lg:hidden" />

    <header class="border-b border-border bg-background px-4 py-4 sm:px-6 lg:px-8">
      <div class="mx-auto flex w-full max-w-7xl flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-semibold text-text-primary sm:text-3xl">{{ pageTitle() }}</h1>
          @if (pageSubtitle()) {
            <p class="mt-2 max-w-2xl text-sm leading-6 text-text-muted">{{ pageSubtitle() }}</p>
          }
        </div>

        <div class="w-full lg:w-auto lg:justify-end">
          <gd-farm-context-selector class="block w-full lg:w-80" selectId="global-farm-select" />
        </div>
      </div>
    </header>

    <main class="px-4 py-5 sm:px-6 lg:px-8 lg:py-6">
      <div class="mx-auto w-full max-w-7xl">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

@if (canShowAiTransactionFab()) {
  <gd-floating-action-button
    class="fixed bottom-[calc(env(safe-area-inset-bottom)+1rem)] right-[calc(env(safe-area-inset-right)+1rem)] z-30 sm:bottom-[calc(env(safe-area-inset-bottom)+1.5rem)] sm:right-[calc(env(safe-area-inset-right)+1.5rem)]"
    icon="sparkles"
    ariaLabel="Nova movimentação com IA"
    tooltipTitle="Nova movimentação com IA"
    tooltipDescription="Descreva em texto e revise antes de salvar"
    (clicked)="requestAiTransaction()"
  />
}
