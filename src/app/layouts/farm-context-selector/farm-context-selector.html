<section
  class="flex min-w-0 items-center gap-3 rounded-app border border-border bg-surface px-3 py-2 shadow-soft"
>
  <div
    class="flex size-9 shrink-0 items-center justify-center rounded-full bg-highlight-soft text-primary"
    aria-hidden="true"
  >
    <svg lucideIcon="tractor" class="size-5"></svg>
  </div>

  <div class="min-w-0 flex-1">
    <label
      [for]="selectId()"
      class="block text-xs font-semibold uppercase tracking-wide text-text-muted"
    >
      Fazenda
    </label>

    @if (options().length > 0) {
      <select
        [id]="selectId()"
        class="mt-0.5 min-h-8 w-full min-w-0 rounded-control border-0 bg-transparent pr-2 text-sm font-semibold text-text-primary focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
        [value]="selectedFarmStore.selectedFarmId() ?? ''"
        (change)="selectFarm($event)"
      >
        @for (farm of options(); track farm.id) {
          <option [value]="farm.id">{{ farm.name }}</option>
        }
      </select>
    } @else if (selectedFarmStore.loading()) {
      <p class="mt-1 truncate text-sm font-medium text-text-muted">Carregando fazendas...</p>
    } @else {
      <p class="mt-1 truncate text-sm font-medium text-text-muted">Nenhuma fazenda disponível</p>
    }
  </div>
</section>
