<aside class="fixed inset-y-0 left-0 z-30 flex w-72 flex-col border-r border-border bg-surface text-text-primary">
  <div class="border-b border-border px-6 py-5">
    <img
      ngSrc="/assets/brand/logo_horizontal.svg"
      width="190"
      height="60"
      alt="Gestão Direta"
      priority
      class="h-12 w-auto"
    />
  </div>

  <nav class="flex-1 px-3 py-4" aria-label="Navegação principal">
    <ul class="space-y-1">
      @for (item of navItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-accent/15 text-primary"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex min-h-10 items-center gap-3 rounded-control px-3 text-sm font-medium text-text-muted transition-colors hover:bg-accent/10 hover:text-primary focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
          >
            <svg [lucideIcon]="item.icon" class="size-5 shrink-0" aria-hidden="true"></svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  @if (sessionStore.user(); as user) {
    <div class="border-t border-border p-4">
      <a
        routerLink="/profile"
        class="-m-2 flex items-center gap-3 rounded-control p-2 transition-colors hover:bg-accent/10 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
      >
        <div
          class="flex size-10 shrink-0 items-center justify-center rounded-full bg-highlight-soft text-sm font-semibold text-primary"
          aria-hidden="true"
        >
          {{ sessionStore.initials() }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-text-primary">{{ user.name }}</p>
          <p class="truncate text-xs text-text-muted">{{ user.email }}</p>
        </div>
      </a>

      <button
        type="button"
        class="mt-4 flex min-h-10 w-full items-center justify-center gap-2 rounded-control border border-border px-3 text-sm font-semibold text-text-primary transition-colors hover:bg-background focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
        (click)="logout()"
      >
        <svg lucideIcon="log-out" class="size-4" aria-hidden="true"></svg>
        <span>Sair</span>
      </button>
    </div>
  }
</aside>
