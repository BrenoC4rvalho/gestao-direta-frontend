<header class="sticky top-0 z-20 border-b border-border bg-surface/95 px-4 py-3 text-text-primary backdrop-blur">
  <div class="flex items-center justify-between gap-3">
    <img
      ngSrc="/assets/brand/logo-mark.svg"
      width="55"
      height="40"
      alt="Gestão Direta"
      priority
      class="h-10 w-auto"
    />

    <button
      type="button"
      class="inline-flex size-10 cursor-pointer items-center justify-center rounded-control border border-border bg-surface text-text-primary transition-colors hover:bg-background focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
      aria-label="Abrir menu de navegação"
      (click)="openMenu()"
    >
      <svg lucideIcon="menu" class="size-5" aria-hidden="true"></svg>
    </button>
  </div>
</header>

<gd-drawer
  [open]="isMenuOpen()"
  title="Menu"
  description="Navegação principal"
  position="right"
  size="sm"
  (closed)="closeMenu()"
>
  <div class="flex min-h-full flex-col">
    <nav class="flex-1" aria-label="Navegação principal mobile">
      <ul class="space-y-1">
        @for (item of navItems(); track item.route) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-accent/15 text-primary"
              [routerLinkActiveOptions]="{ exact: true }"
              class="flex min-h-11 cursor-pointer items-center gap-3 rounded-control px-3 text-sm font-medium text-text-muted transition-colors hover:bg-accent/10 hover:text-primary focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
              (click)="closeMenu()"
            >
              <svg [lucideIcon]="item.icon" class="size-5 shrink-0" aria-hidden="true"></svg>
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    @if (sessionStore.user(); as user) {
      <div class="mt-6 border-t border-border pt-4">
        <a
          routerLink="/profile"
          class="-m-2 flex cursor-pointer items-center gap-3 rounded-control p-2 transition-colors hover:bg-accent/10 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
          (click)="closeMenu()"
        >
          <div
            class="flex size-10 shrink-0 items-center justify-center rounded-full bg-highlight-soft text-sm font-semibold text-primary"
            aria-hidden="true"
          >
            {{ sessionStore.initials() }}
          </div>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-semibold text-text-primary">{{ user.name }}</p>
            <p class="truncate text-xs text-text-muted">{{ user.email }}</p>
          </div>
        </a>

        <gd-theme-toggle-button class="mt-4 block" />

        <button
          type="button"
          class="mt-3 flex min-h-11 w-full cursor-pointer items-center justify-center gap-2 rounded-control border border-border px-3 text-sm font-semibold text-text-primary transition-colors hover:bg-background focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
          (click)="logout()"
        >
          <svg lucideIcon="log-out" class="size-4" aria-hidden="true"></svg>
          <span>Sair</span>
        </button>
      </div>
    }
  </div>
</gd-drawer>
